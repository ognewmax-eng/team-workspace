{% extends 'resources/base.html' %}{% block resource_content %}<section class="resource-panel resource-form-page"><h1>Перенести статью в архив?</h1><p>«{{ article.title }}» исчезнет из основного списка. Текст, вложения и история сохранятся. Статью можно восстановить.</p><form method="post">{% csrf_token %}<input type="hidden" name="version" value="{{ version }}"><div class="resource-actions"><button class="btn btn-primary">В архив</button><a href="{% url 'wiki_detail' article.pk %}">Отмена</a></div></form></section>{% endblock %}
