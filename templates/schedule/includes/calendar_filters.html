<form method="get" class="planner-filters" data-calendar-filter>
<div class="planner-filter-row"><label>Отдел<select name="department"><option value="">Все доступные</option>{% for d in departments %}<option value="{{ d.pk }}" {% if request.GET.department == d.pk|stringformat:'s' %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label><label>Преподаватель<select name="teacher"><option value="">Все</option>{% for t in teachers %}<option value="{{ t.pk }}" {% if request.GET.teacher == t.pk|stringformat:'s' %}selected{% endif %}>{{ t.get_full_name|default:t.username }}</option>{% endfor %}</select></label><label>Объединение<select name="association"><option value="">Все объединения</option>{% for a in associations %}<option value="{{ a.pk }}" {% if request.GET.association == a.pk|stringformat:'s' %}selected{% endif %}>{{ a.name }}</option>{% endfor %}</select></label><label>Перейти к дате<input type="date" name="date" value="{{ request.GET.date|default:calendar_initial }}"></label><button class="btn btn-primary" type="submit">Применить</button><a href="{% url 'schedule_main' %}">Сбросить</a></div>
<div class="planner-layers"><input type="hidden" name="layers_set" value="1">{% for value,label in event_types %}<label><input type="checkbox" name="layer" value="{{ value }}" {% if value in selected_layers %}checked{% endif %} data-layer="{{ value }}"> {{ label }}</label>{% endfor %}<label><input type="checkbox" name="mine" value="1" {% if request.GET.mine == '1' %}checked{% endif %}> Моё участие</label><label><input type="checkbox" name="finished" value="1" {% if request.GET.finished == '1' %}checked{% endif %}> Завершённые задачи</label></div>
</form>
