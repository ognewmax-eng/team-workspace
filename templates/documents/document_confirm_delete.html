{% extends 'resources/base.html' %}{% block resource_content %}<section class="resource-panel resource-form-page"><h1>Перенести документ в архив?</h1><p>«{{ document.title }}» исчезнет из списка действующих документов. Файл сохранится, документ можно будет восстановить.</p><form method="post">{% csrf_token %}<input type="hidden" name="version" value="{{ version }}"><div class="resource-actions"><button class="btn btn-primary">В архив</button><a href="{% url 'document_detail' document.pk %}">Отмена</a></div></form></section>{% endblock %}
