{% extends "base.html" %}

{% block title %}Удалить мероприятие{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4><i class="bi bi-trash"></i> Удалить мероприятие?</h4>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить мероприятие <strong>«{{ meropriyatie.title }}»</strong>? Оно также будет удалено из общего расписания.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{% url 'meropriyatie_detail' meropriyatie.id %}" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
