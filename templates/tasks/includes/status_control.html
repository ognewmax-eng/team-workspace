{% if task.ui_can_change %}<label class="task-status-control"><span>{% if task.ui_assignment %}Мой статус{% else %}Общий статус{% endif %}</span><select data-status-select data-current="{% if task.ui_assignment %}{{ task.ui_assignment.status }}{% else %}{{ task.status }}{% endif %}" aria-label="Изменить {% if task.ui_assignment %}мой{% else %}общий{% endif %} статус задачи {{ task.title }}">{% for value,label in status_choices %}<option value="{{ value }}" {% if task.ui_assignment and task.ui_assignment.status == value or not task.ui_assignment and task.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>{% else %}<span class="task-read-only"><i class="bi bi-eye"></i> Статус меняет исполнитель</span>{% endif %}
